[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-school-bot"
version = "0.1.0"
description = "Small reliable family Telegram bot for MESH"
requires-python = ">=3.12"
dependencies = ["httpx[socks]>=0.28,<0.29", "pydantic>=2.11,<3", "python-dotenv>=1.1,<2",
                "aiogram>=3.20,<4", "aiohttp-socks>=0.10,<0.12", "aiosqlite>=0.21,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tools"]
